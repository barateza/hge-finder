name: Update coverage badge (create PR)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly; change as desired

permissions:
  contents: write
  pull-requests: write

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    env:
      # Set to 'true' to also update README.md between markers (optional)
      UPDATE_README: 'false'
      # Branch where the raw JSON will be served from (change if your default branch isn't 'main')
      BADGE_BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests and generate coverage JSON
        run: |
          run: pytest --cov-report=json:coverage.json

      - name: Generate shields endpoint JSON from coverage.json
        run: |
          python .github/scripts/compute_coverage_badge.py coverage.json .github/coverage/coverage-badge.json

      - name: (optional) Update README badge placeholder
        if: env.UPDATE_README == 'true'
        run: |
          python .github/scripts/update_readme_badge.py .github/coverage/coverage-badge.json README.md

      - name: Create pull request with updated badge
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: update coverage badge"
          branch: coverage-badge/${{ github.run_id }}
          title: "ci: update coverage badge"
          body: |
            This automated PR updates the repository's coverage badge (shields endpoint JSON or README).
            The change is generated from the latest test run in CI.
          labels: automated, coverage-badge
          base: main